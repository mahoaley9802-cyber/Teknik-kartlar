<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Teknik Kartlar"><title>Teknik Kartlar AI</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230066ff'/><rect x='22' y='26' width='56' height='48' rx='8' fill='white'/><path d='M32 42h36M32 54h24' stroke='%230066ff' stroke-width='6' stroke-linecap='round'/></svg>">
<style>
:root{--bg:#f4f6f9;--c:#fff;--t:#111;--s:#666;--p:#0066ff;--b:#dce1e7}@media(prefers-color-scheme:dark){:root{--bg:#0b0c0e;--c:#181a1f;--t:#eee;--s:#999;--p:#3b82f6;--b:#2c303a}}
*{box-sizing:border-box;font-family:-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}body{margin:0;padding:calc(14px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));background:var(--bg);color:var(--t)}.row{display:flex;gap:4px;margin-bottom:8px}.tab{flex:1;padding:9px 2px;border:1px solid var(--b);background:var(--c);border-radius:10px;text-align:center;font-weight:600;font-size:12px;cursor:pointer}.tab.on{background:var(--p);color:#fff;border-color:var(--p)}.sec{display:none}.sec.on{display:block}.box{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:13px}.btn{width:100%;padding:11px;border:0;border-radius:10px;background:var(--p);color:#fff;font-weight:600;margin-top:8px;font-size:14px;cursor:pointer}input,textarea,select{width:100%;padding:9px;margin-top:5px;border-radius:9px;border:1px solid var(--b);background:var(--c);color:var(--t);font-size:14px}pre{background:#111;color:#0f0;padding:8px;border-radius:6px;white-space:pre-wrap;font-size:12px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:10px}.rb{padding:9px 2px;border:0;border-radius:8px;color:#fff;font-size:11px;font-weight:600;cursor:pointer}.bar{height:6px;background:var(--b);border-radius:4px;overflow:hidden;margin:4px 0 8px}.fill{height:100%;background:var(--p)}.opt{width:100%;text-align:left;padding:11px;margin-top:6px;border:1px solid var(--b);border-radius:10px;background:var(--bg);color:var(--t);font-size:14px;cursor:pointer}.opt.ok{background:#2e7d32;color:#fff;border-color:#2e7d32}.opt.no{background:#c62828;color:#fff;border-color:#c62828}.exp{margin-top:10px;padding:9px;border-radius:8px;background:var(--bg);border-left:3px solid var(--p);font-size:13px;line-height:1.45}.smbtn{float:right;margin-left:5px;padding:4px 8px;border:1px solid var(--b);border-radius:6px;background:var(--bg);color:var(--t);font-size:12px;cursor:pointer}
</style></head><body>
<div style="display:flex;justify-content:space-between;font-size:14px"><b>Teknik Kartlar AI</b><span id="bg">Bugün: 0</span></div>
<div style="font-size:11px;color:var(--s);display:flex;justify-content:space-between"><span id="stTxt">Hedef: 0/15</span><span id="totTxt">Toplam: 0</span></div>
<div class="bar"><div class="fill" id="pBar" style="width:0%"></div></div>
<div class="row"><div class="tab on" id="t1" onclick="tab(1)">Çalış</div><div class="tab" id="t2" onclick="tab(2)">Ekle/Düzenle</div><div class="tab" id="t3" onclick="tab(3)">AI PDF/Yedek</div><div class="tab" id="t4" onclick="tab(4)">Ayar/Özet</div></<div id="s1" class="sec on"><div style="display:flex;gap:5px;margin-bottom:8px"><select id="flt" onchange="modeChg()" style="margin:0;flex:2"><option value="ALL">Tümü</option></select><select id="md" onchange="modeChg()" style="margin:0;flex:1"><option value="mcq">Test (Şıklı)</option><option value="exam">⏱️ Deneme Sınavı</option><option value="card">Kart</option><option value="quiz">Yazarak</option></select></div><div id="out"></div></div>
<div id="s2" class="sec"><div class="box"><input type="hidden" id="editId"><input id="d" placeholder="Kategori"><textarea id="f" placeholder="Soru / Ön Yüz"></textarea><textarea id="b" placeholder="Doğru Cevap"></textarea><input id="o2" placeholder="Yanlış Şık 1"><input id="o3" placeholder="Yanlış Şık 2"><input id="o4" placeholder="Yanlış Şık 3"><textarea id="ex" placeholder="Kısa Açıklama / Çözüm Notu"></textarea><textarea id="c" placeholder="Kod Bloğu"></textarea><input type="file" id="im" accept="image/*" onchange="rd(this)"><button class="btn" onclick="add()">Kaydet</button><button class="btn" style="background:#666;display:none" id="cancelEdit" onclick="clrForm()">Düzenlemeyi İptal Et</button></div></div>
<div id="s3" class="sec"><div class="box" style="margin-bottom:8px"><b>✨ Yapay Zeka ile Çoktan Seçmeli Test Üret</b><div style="display:flex;gap:6px;align-items:center;margin-top:6px"><small style="color:var(--s);flex:1">Soru Sayısı:</small><select id="qCnt" style="margin:0;flex:1"><option value="15">15 Soru</option><option value="30" selected>30 Soru</option><option value="50">50 Soru</option><option value="75">75 Soru</option><option value="100">100 Soru</option></select></div><input type="file" accept=".pdf" onchange="aiPDF(event)"><div id="aiMsg" style="font-size:12px;color:var(--p);margin-top:6px;font-weight:600"></div></div><div class="box" style="margin-bottom:8px"><b>Tam Yedek (JSON) & CSV</b><div style="display:flex;gap:6px"><button class="btn" style="background:#00796b" onclick="exJSON()">Tam Yedek İndir</button><button class="btn" style="background:#555" onclick="document.getElementById('jIn').click()">Yedek Yükle</button></div><input type="file" id="jIn" accept=".json" style="display:none" onchange="inJSON(event)"><div style="display:flex;gap:6px"><button class="btn" style="background:#555" onclick="ec()">CSV İndir</button><button class="btn" style="background:#c62828" onclick="clrAll()">Tümünü Sil</button></div></div><div id="lst"></div></div>
<div id="s4" class="sec"><div class="box" style="margin-bottom:8px"><b>Gemini AI Anahtarı</b><input id="apiKeyIn" type="password" placeholder="AIzaSy... anahtarınızı yapıştırın" onchange="localStorage.setItem('g_key',this.value.trim());alert('Anahtar kaydedildi!')"><small style="color:var(--s)">Google AI Studio üzerinden aldığınız anahtar.</small></div><div class="box"><b>İstatistik</b><p id="statDetail" style="font-size:13px;line-height:1.7"></p><small>Günlük Hedef:</small><input type="number" id="goalIn" value="15" onchange="st.goal=Math.max(1,parseInt(this.value)||15);sv()"></div></div>
<script>
var db=new Array(),st={day:'',cnt:0,goal:15},cur=null,sh=0,img='',picked=-1,exm=null,tmr=null;try{var s1=JSON.parse(localStorage.getItem('k_ok'));if(s1&&s1.length)db=s1;var s2=JSON.parse(localStorage.getItem('k_st'));if(s2)st=s2}catch(e){}if(st.day!=new Date().toDateString()){st.day=new Date().toDateString();st.cnt=0}document.getElementById('apiKeyIn').value=localStorage.getItem('g_key')||'';
function sv(){try{localStorage.setItem('k_ok',JSON.stringify(db));localStorage.setItem('k_st',JSON.stringify(st))}catch(e){}dk();upSt()}
function upSt(){var wc=db.filter(x=>x.wrong).length;document.getElementById('stTxt').innerText='Hedef: '+st.cnt+'/'+st.goal;document.getElementById('totTxt').innerText='Toplam: '+db.length;document.getElementById('pBar').style.width=Math.min(100,Math.round(st.cnt/st.goal*100))+'%';document.getElementById('goalIn').value=st.goal;document.getElementById('statDetail').innerHTML='Bugün: <b>'+st.cnt+'</b><br>Toplam: <b>'+db.length+'</b><br>Öğrenilen: <b>'+db.filter(x=>x.r>0).length+'</b><br>Yanlış Yapılanlar: <b style="color:#d32f2f">'+wc+'</b><br>Bekleyen: <b>'+db.filter(x=>x.due<=Date.now()).length+'</b>'}
function tab(x){if(tmr){clearInterval(tmr);tmr=null}Array.of(1,2,3,4).forEach(i=>{document.getElementById('t'+i).classList.toggle('on',i==x);document.getElementById('s'+i).classList.toggle('on',i==x)});if(x==1)modeChg();if(x==3)ls();if(x==4)upSt()}
function sp(t){speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';speechSynthesis.speak(u)}
function rd(el){var f=el.files.item(0);if(!f)return;var r=new FileReader();r.onload=e=>img=e.target.result;r.readAsDataURL(f)}
function clrForm(){Array.of('editId','f','b','o2','o3','o4','ex','c','im').forEach(k=>document.getElementById(k).value='');img='';document.getElementById('cancelEdit').style.display='none'}
function editCard(id){var x=db.find(i=>i.id==id);if(!x)return;tab(2);document.getElementById('editId').value=x.id;document.getElementById('d').value=x.d;document.getElementById('f').value=x.f;document.getElementById('b').value=x.b;var wr=(x.opts||Array.of()).filter(o=>o!=x.b);document.getElementById('o2').value=wr.at(0)||'';document.getElementById('o3').value=wr.at(1)||'';document.getElementById('o4').value=wr.at(2)||'';document.getElementById('ex').value=x.exp||'';document.getElementById('c').value=x.c||'';document.getElementById('cancelEdit').style.display='block'}
function add(){var eid=val('editId'),d=val('d')||'Genel',f=val('f'),b=val('b'),ex=val('ex'),c=val('c'),opts=Array.of(b,val('o2'),val('o3'),val('o4')).filter(Boolean);if(!f||!b)return alert('Soru ve cevabı yazın');if(eid){var x=db.find(i=>i.id==eid);if(x){x.d=d;x.f=f;x.b=b;x.opts=opts;x.exp=ex;x.c=c;if(img)x.i=img}}else{db.push({id:Date.now(),d:d,f:f,b:b,opts:opts,exp:ex,c:c,i:img,r:0,n:0,e:2.5,due:Date.now(),wrong:0})}sv();clrForm();alert(eid?'Güncellendi!':'Eklendi!');if(eid)tab(1)}
function val(id){return document.getElementById(id).value.trim()}
function dk(){var s=document.getElementById('flt'),v=s.value,u=Array.from(new Set(db.map(x=>x.d))),wc=db.filter(x=>x.wrong).length;s.innerHTML='<option value="ALL">Tümü</option><option value="WRONG">❌ Yanlış Yapılanlar ('+wc+')</option>'+u.map(x=>'<option value="'+x+'">'+x+'</option>').join('');if(v=='WRONG'||u.includes(v))s.value=v}
function modeChg(){if(tmr){clearInterval(tmr);tmr=null}if(val('md')=='exam')startExam();else nxt()}
function startExam(){var f=val('flt'),pool=db.filter(x=>(f=='WRONG'?x.wrong:(f=='ALL'||x.d==f))&&x.opts&&x.opts.length>1);if(!pool.length){document.getElementById('out').innerHTML='<div class="box" style="text-align:center"><h4>Bu kategoride şıklı soru yok!</h4></div>';return}exm={list:pool.slice().sort(()=>Math.random()-.5),idx:0,ok:0,no:0,sec:pool.length*60,ans:-1};tmr=setInterval(()=>{exm.sec--;var el=document.getElementById('tmTxt');if(el)el.innerText=fmtT(exm.sec);if(exm.sec<=0)endExam()},1000);drawExam()}
function fmtT(s){var m=Math.floor(Math.max(0,s)/60),r=Math.max(0,s)%60;return(m<10?'0':'')+m+':'+(r<10?'0':'')+r}
function drawExam(){var q=exm.list.at(exm.idx);if(!q.shuf)q.shuf=q.opts.slice().sort(()=>Math.random()-.5);var btns=q.shuf.map((opt,i)=>{var cls='opt';if(exm.ans!=-1){if(opt==q.b)cls+=' ok';else if(i==exm.ans)cls+=' no'}return '<button class="'+cls+'" onclick="ansExam('+i+')">'+String.fromCharCode(65+i)+') '+opt+'</button>'}).join('');var exH=exm.ans!=-1&&q.exp?'<div class="exp"><b>💡 Açıklama:</b> '+q.exp+'</div>':'';document.getElementById('out').innerHTML='<div class="box"><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--p);font-weight:600"><span>Soru '+(exm.idx+1)+' / '+exm.list.length+'</span><span id="tmTxt">⏱️ '+fmtT(exm.sec)+'</span></div><p style="font-size:17px">'+q.f+'</p>'+btns+exH+'<div style="display:flex;gap:6px;margin-top:10px"><button class="btn" style="background:#555" onclick="endExam()">Sınavı Bitir</button><button class="btn" onclick="nextExam()">'+(exm.idx+1<exm.list.length?'Sonraki Soru ➡️':'Sonucu Gör')+'</button></div></div>'}
function ansExam(i){if(exm.ans!=-1)return;exm.ans=i;var q=exm.list.at(exm.idx);st.cnt++;if(q.shuf.at(i)==q.b){exm.ok++;q.wrong=0}else{exm.no++;q.wrong=1}sv();drawExam()}
function nextExam(){if(exm.idx+1<exm.list.length){exm.idx++;exm.ans=-1;drawExam()}else endExam()}
function endExam(){if(tmr){clearInterval(tmr);tmr=null}var tot=exm.list.length,emp=tot-(exm.ok+exm.no),scr=Math.round(exm.ok/tot*100);document.getElementById('out').innerHTML='<div class="box" style="text-align:center"><h3>🏆 Deneme Sınavı Sonucu</h3><p style="font-size:28px;font-weight:700;color:var(--p);margin:8px 0">%'+scr+'</p><p style="font-size:14px;line-height:1.8">✅ Doğru: <b>'+exm.ok+'</b><br>❌ Yanlış: <b>'+exm.no+'</b><br>⚪ Boş: <b>'+emp+'</b></p><button class="btn" onclick="startExam()">Tekrar Sınav Ol</button></div>'}
function nxt(){var f=val('flt'),due=db.filter(x=>(f=='WRONG'?x.wrong:(f=='ALL'||x.d==f)&&x.due<=Date.now()));document.getElementById('bg').innerText='Bugün: '+due.length;var o=document.getElementById('out');if(!due.length){o.innerHTML='<div class="box" style="text-align:center"><h4>'+(f=='WRONG'?'Yanlış listeniz boş!':'Bitti!')+'</h4><button class="btn" onclick="db.forEach(x=>x.due=Date.now());sv();nxt()">Tekrar Et</button></div>';return}cur=due.at(0);sh=0;picked=-1;if(cur.opts&&cur.opts.length>1)cur.shuf=cur.opts.slice().sort(()=>Math.random()-.5);drw()}
function pick(idx){if(sh)return;picked=idx;sh=1;if(cur.shuf.at(idx)==cur.b)cur.wrong=0;else cur.wrong=1;sv();drw()}
function drw(){if(!cur)return;var o=document.getElementById('out'),m=val('md'),ch=cur.c?'<pre>'+cur.c+'</pre>':'',ih=cur.i?'<img src="'+cur.i+'" style="max-width:100%;border-radius:8px;margin-top:6px">':'',exH=cur.exp?'<div class="exp"><b>💡 Açıklama:</b> '+cur.exp+'</div>':'',topBtns='<button class="smbtn" onclick="sp(cur.f)">🔊</button><button class="smbtn" onclick="editCard('+cur.id+')">✏️ Düzenle</button>',rates='<div class="g"><button class="rb" style="background:#d32f2f" onclick="rt(1)">Tekrar<br>1dk</button><button class="rb" style="background:#f57c00" onclick="rt(3)">Zor<br>12sa</button><button class="rb" style="background:#388e3c" onclick="rt(4)">İyi<br>1g</button><button class="rb" style="background:#00796b" onclick="rt(5)">Kolay<br>4g</button></div>';
if(m=='mcq'&&cur.shuf&&cur.shuf.length>1){var btns=cur.shuf.map((opt,i)=>{var cls='opt';if(sh){if(opt==cur.b)cls+=' ok';else if(i==picked)cls+=' no'}return '<button class="'+cls+'" onclick="pick('+i+')">'+String.fromCharCode(65+i)+') '+opt+'</button>'}).join('');o.innerHTML='<div class="box"><small>'+cur.d+(cur.wrong?' • ❌':'')+'</small>'+topBtns+'<p style="font-size:17px">'+cur.f+'</p>'+btns+(sh?exH+ch+ih+rates:'')+'</div>';return}
var qz=m=='quiz'&&!sh?'<input id="qIn" placeholder="Cevabınız...">':'',qRes=m=='quiz'&&sh&&document.getElementById('qIn')?'<div style="padding:6px;background:var(--bg);margin-bottom:6px;font-size:12px"><b>Cevabın:</b> '+(document.getElementById('qIn').value||'-')+'</div>':'';o.innerHTML=!sh?'<div class="box"><small>'+cur.d+'</small>'+topBtns+'<p style="font-size:17px">'+cur.f+'</p>'+qz+'<button class="btn" onclick="sh=1;drw()">Cevabı Göster</button></div>':'<div class="box"><small>'+cur.d+'</small>'+topBtns+'<p style="opacity:.7">'+cur.f+'</p><hr>'+qRes+'<p style="font-size:16px">'+cur.b+'</p>'+exH+ch+ih+rates+'</div>'}
function rt(q){st.cnt++;if(q<3){cur.r=0;cur.n=0;cur.due=Date.now()+6e4;cur.wrong=1}else{cur.n=cur.r==0?1:cur.r==1?6:Math.round(cur.n*cur.e);if(q==3)cur.n=Math.max(.5,cur.n*.8);if(q==5)cur.n=Math.round(cur.n*1.3)+1;cur.r++;cur.e=Math.max(1.3,cur.e+(.1-(5-q)*(.08+(5-q)*.02)));cur.due=Date.now()+cur.n*864e5}sv();nxt()}
function ls(){document.getElementById('lst').innerHTML=db.map(x=>'<div class="box" style="margin-bottom:6px;display:flex;justify-content:space-between;align-items:center"><div><small>'+x.d+(x.wrong?' • ❌':'')+'</small><br><b>'+x.f+'</b></div><div style="display:flex;gap:4px"><button onclick="editCard('+x.id+')" style="background:#0066ff;color:#fff;border:0;padding:5px 8px;border-radius:6px">✏️</button><button onclick="db=db.filter(y=>y.id!='+x.id+');sv();ls()" style="background:#d32f2f;color:#fff;border:0;padding:5px 8px;border-radius:6px">Sil</button></div></div>').join('')}
function clrAll(){if(!confirm('Tüm kartlar silinsin mi?'))return;db=new Array();sv();ls();nxt()}
async function aiPDF(e){var f=e.target.files.item(0),key=localStorage.getItem('g_key'),msg=document.getElementById('aiMsg'),cnt=val('qCnt')||'30';if(!f)return;if(!key)return alert('Önce Ayar/Özet sekmesinden Gemini API anahtarını girin!');if(f.size>8000000)return alert('PDF dosyası 8 MB altında olmalıdır.');msg.innerText='Hızlı AI modeli aranıyor...';var r=new FileReader();r.onload=async function(){try{var b64=r.result.split(',').at(1),host='generativelanguage.'+'googleapis.com',mRes=await fetch('https://'+host+'/v1beta/models?key='+key),mData=await mRes.json();if(mData.error)throw new Error(mData.error.message);var mdls=mData.models.filter(m=>m.supportedGenerationMethods&&m.supportedGenerationMethods.includes('generateContent')&&m.name.includes('gemini')&&!m.name.includes('pro')&&!m.name.includes('thinking')).map(m=>m.name),data=null,lastErr='';for(var mName of mdls){try{msg.innerText=cnt+' adet soru üretiliyor, lütfen bekleyin ('+mName.replace('models/','')+')...';var prompt='Sen titiz bir sınav hazırlama uzmanısın. Bu PDF belgesini kelime kelime analiz et ve SADECE belgede açıkça yazan kurallara dayanarak '+cnt+' adet Türkçe çoktan seçmeli soru üret. KRİTİK KURALLAR: 1) Belgede yazmayan hiçbir şeyi uydurma. 2) Doğru cevap metindeki kuralın aynısı olmalı, asla zıttı olmamalı. 3) Yanlış şıklar mantıklı çeldiriciler olmalı ama belgedeki kurala göre kesinlikle yanlış olmalı. 4) Kısa açıklama (en fazla 1 cümle) doğru cevabı birebir doğrulamalı. Her satırda SADECE şu 6 bölümlü formatı kullan: Soru|Doğru Cevap|Yanlış Şık 1|Yanlış Şık 2|Yanlış Şık 3|Kısa Açıklama';var res=await fetch('https://'+host+'/v1beta/'+mName+':generateContent?key='+key,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({generationConfig:{maxOutputTokens:8192},contents:Array.of({parts:Array.of({inline_data:{mime_type:'application/pdf',data:b64}},{text:prompt})})})});var d=await res.json();if(!d.error){data=d;break}lastErr=d.error.message}catch(ex){lastErr=ex.message}}if(!data)throw new Error(lastErr||'Uygun hızlı model yanıt vermedi');var out=data.candidates.at(0).content.parts.at(0).text,n=0,cat=f.name.replace(/\.pdf$/i,'');out.split('\n').forEach(l=>{var p=l.split('|');if(p.length>=5){var ans=p.at(1).trim(),opts=Array.of(ans,p.at(2).trim(),p.at(3).trim(),p.at(4).trim()),exTxt=(p.at(5)||'').trim();db.push({id:Date.now()+Math.random(),d:cat,f:p.at(0).trim(),b:ans,opts:opts,exp:exTxt,c:'',i:'',r:0,n:0,e:2.5,due:Date.now(),wrong:0});n++}});sv();ls();msg.innerText='';alert(n+' adet soru oluşturuldu!')}catch(err){msg.innerText='';alert('Hata: '+err.message)}};r.readAsDataURL(f)}
function exJSON(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='teknik_kartlar_yedek.json';a.click()}
function inJSON(e){var f=e.target.files.item(0);if(!f)return;var r=new FileReader();r.onload=ev=>{try{var arr=JSON.parse(ev.target.result);if(Array.isArray(arr)){db=arr;sv();ls();alert(arr.length+' kart yedekten yüklendi!')}}catch(x){alert('Geçersiz yedek dosyası')}};r.readAsText(f,'UTF-8')}
function ec(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFFKategori;Ön;Arka;Kod\n'+db.map(x=>x.d+';'+x.f+';'+x.b+';'+x.c).join('\n')],{type:'text/csv'}));a.download='kartlar.csv';a.click()}
dk();upSt();nxt();
</script></body></html>
